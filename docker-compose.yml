services:
  glibc231:
    build:
      context: ./docker
      dockerfile: Dockerfile.glibc231
    image: heap-lab-glibc231:latest
    volumes:
      - .:/heap-lab
    tty: true
    stdin_open: true
    # ptrace 기반 gdb 디버깅에 필요 (컨테이너 기본 보안 옵션 완화)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  glibc239:
    build:
      context: ./docker
      dockerfile: Dockerfile.glibc239
    image: heap-lab-glibc239:latest
    volumes:
      - .:/heap-lab
    tty: true
    stdin_open: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
